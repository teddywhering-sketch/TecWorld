services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-provedor}
      POSTGRES_USER: ${POSTGRES_USER:-provedor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provedor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-provedor} -d ${POSTGRES_DB:-provedor}"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  web:
    build: .
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:
