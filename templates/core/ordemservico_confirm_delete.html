{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="text-danger mb-4">Excluir Ordem de Serviço</h3>
            <p>Você tem certeza que deseja excluir a ordem de serviço <strong>{{ object }}</strong>?</p>
            <p class="text-muted"><small>Esta ação não pode ser desfeita e todas as informações relacionadas a esta OS serão apagadas.</small></p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'ordem-detail' object.pk %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
