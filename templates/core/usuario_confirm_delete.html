{% extends 'base.html' %}

{% block content %}
<div class="card max-w-sm mx-auto mt-5">
    <div class="card-body text-center py-5">
        <i class="bi bi-exclamation-triangle text-danger fs-1 mb-3"></i>
        <h4 class="card-title">Excluir Usuário</h4>
        <p class="text-secondary mb-4">Tem certeza que deseja excluir o usuário <strong>{{ object.username }}</strong>? Esta ação não pode ser desfeita e pode causar erro se o usuário estiver vinculado a registros no sistema.</p>
        <form method="post">
            {% csrf_token %}
            <a href="{% url 'usuario-list' %}" class="btn btn-light me-2">Cancelar</a>
            <button type="submit" class="btn btn-danger">Sim, Excluir</button>
        </form>
    </div>
</div>
{% endblock %}
