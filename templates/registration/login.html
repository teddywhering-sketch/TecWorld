{% extends 'base.html' %}{% block guest_content %}<main class="min-vh-100 d-flex align-items-center justify-content-center p-3" style="background:linear-gradient(135deg,#17203a,#4154f1)"><div class="card p-4 p-md-5" style="width:100%;max-width:430px"><div class="text-center mb-4"><div class="metric-icon mx-auto mb-3" style="background:#e7eafe;color:#4154f1"><i class="bi bi-router-fill"></i></div><h2 class="fw-bold">TecWorld</h2><p class="text-secondary">Acesse a operação do seu provedor</p></div><form method="post">{% csrf_token %}{% if form.errors %}<div class="alert alert-danger py-2">Usuário ou senha inválidos.</div>{% endif %}<div class="mb-3"><label class="form-label">Usuário</label><input class="form-control" name="username" autofocus required></div><div class="mb-4"><label class="form-label">Senha</label><input class="form-control" name="password" type="password" required></div><button class="btn btn-primary w-100 py-2">Entrar <i class="bi bi-arrow-right ms-1"></i></button></form></div></main>{% endblock %}
