upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name teddytecworld.tech www.teddytecworld.tech;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name teddytecworld.tech www.teddytecworld.tech;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/teddytecworld.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teddytecworld.tech/privkey.pem;
    
    # Configurações de segurança recomendadas pelo Let's Encrypt
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
